name: Linear Release

# The version tag deploys the docs to production, so it completes the release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  linear-release:
    # ref: https://github.com/VerifiedInc/verified-github-action-workflows
    uses: verifiedinc/verified-github-action-workflows/.github/workflows/linear-release.yml@v1.2.0
    with:
      mode: complete
    secrets:
      LINEAR_TAGGED_RELEASES_KEY: ${{ secrets.LINEAR_TAGGED_RELEASES_KEY }}
      SLACK_WEBHOOK_URL_DEVELOPMENT: ${{ secrets.SLACK_WEBHOOK_URL_DEVELOPMENT }}
